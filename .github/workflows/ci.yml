name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Scan repository files for secrets
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir --redact /repo

      - name: Check project version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"0\.\d+\.\d+", version):
              raise SystemExit(f"Expected a pre-1.0 semantic version, got {version!r}")
          readme = Path("README.md").read_text(encoding="utf-8")
          if f"**Verzió:** `{version}`" not in readme:
              raise SystemExit("README version does not match VERSION")
          PY

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          DB_USER=ci_user \
          DB_PASSWORD=ci-only-placeholder-not-a-secret \
          DB_NAME=ci_database \
          DB_HOST=postgres \
          TELEGRAM_BOT_TOKEN=123456789012345678901234567890 \
          docker compose config --quiet

      - name: Build production image
        run: docker build --file docker/Dockerfile --tag job-notifier:ci .
